<script>
/* ===== MULTIPLAYER WEBSOCKET (aktif otomatis saat dibuka dari server game) ===== */
(function(){
if(!window.MN_WS)return;
const PID=(()=>{try{let k=localStorage.getItem("mn-pid");if(!k){k=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,"0")).join("");localStorage.setItem("mn-pid",k)}return k}catch(e){return Math.random().toString(36).slice(2,12)+Date.now().toString(36)}})();
const st={ws:null,ok:false,me:"",peers:new Map(),my:{},pend:null,conn:new Set(),pl:new Set(),ev:new Map(),tries:0,t:0,rx:0,fr:0,started:false};
const mk=(id,by,p)=>({peer:id,by,isMe:id===st.me,sameTab:id===st.me,kind:"viewer",guest:false,presence:p||{},updatedAt:Date.now()});
const apply=(o,patch)=>{const r=Object.assign({},o);for(const k in patch){if(patch[k]===null)delete r[k];else r[k]=patch[k]}return r};
function notify(){if(st.fr)return;st.fr=setTimeout(()=>{st.fr=0;const a=[...st.peers.values()];for(const f of st.pl)try{f({peers:a,joined:[],left:[],updated:[]})}catch(e){}},33)}
function setConn(v){if(st.ok===v)return;st.ok=v;for(const f of st.conn)try{f(v)}catch(e){}}
function send(o){const w=st.ws;if(w&&w.readyState===1){try{w.send(JSON.stringify(o))}catch(e){}}}
function open(){
 clearTimeout(st.t);if(st.ws)return;
 let ws;try{ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws")}catch(e){retry();return}
 st.ws=ws;clearTimeout(st.ct);st.ct=setTimeout(()=>{if(st.ws===ws&&!st.ok)try{ws.close()}catch(e){}},8000);
 ws.onopen=()=>{st.rx=Date.now();ws.send(JSON.stringify({t:"hi",pid:PID,p:st.my}))};
 ws.onmessage=ev=>{st.rx=Date.now();let m;try{m=JSON.parse(ev.data)}catch(e){return}
  if(m.t==="hello"){st.me=m.id;st.tries=0;st.peers.clear();for(const q of m.peers)st.peers.set(q.id,mk(q.id,q.by,q.p));st.peers.set(st.me,mk(st.me,PID,st.my));setConn(true);notify()}
  else if(m.t==="b"){for(const id in m.u){if(id===st.me)continue;const o=st.peers.get(id);st.peers.set(id,o?Object.assign({},o,{presence:apply(o.presence,m.u[id]),updatedAt:Date.now()}):mk(id,"",apply({},m.u[id])))}
   for(const id of m.l||[])st.peers.delete(id);notify()}
  else if(m.t==="c"){const hs=st.ev.get(m.k);if(hs){const msg={topic:m.k,data:m.d,peer:m.id,by:m.by,isMe:m.id===st.me,sameTab:m.id===st.me,kind:"viewer",guest:false};for(const f of hs)try{f(msg)}catch(e){}}}
 };
 ws.onclose=()=>{if(st.ws!==ws)return;st.ws=null;st.peers.clear();setConn(false);notify();retry()};
 ws.onerror=()=>{try{ws.close()}catch(e){}};
}
function retry(){st.tries++;clearTimeout(st.t);st.t=setTimeout(open,Math.min(6000,400*2**Math.min(st.tries,4))+Math.random()*300)}
function now(){clearTimeout(st.t);if(!st.ws)open()}
function start(){if(st.started)return;st.started=true;open();
 setInterval(()=>{if(st.pend&&st.ok){send({t:"p",p:st.pend});st.pend=null}},100);
 setInterval(()=>{if(st.ws&&st.ws.readyState===1){send({t:"x"});if(Date.now()-st.rx>20000)try{st.ws.close()}catch(e){}}},8000);
 addEventListener("online",now);addEventListener("pageshow",now);document.addEventListener("visibilitychange",()=>{if(!document.hidden)now()})}
const room={
 emit(k,d){if(!st.ok)return Promise.resolve();send({t:"c",k,d});return Promise.resolve()},
 on(k,f){let s=st.ev.get(k);if(!s)st.ev.set(k,s=new Set());s.add(f);return()=>s.delete(f)},
 presence(patch){st.my=apply(st.my,patch);st.pend=Object.assign(st.pend||{},patch);const me=st.peers.get(st.me);if(me){st.peers.set(st.me,Object.assign({},me,{presence:apply(me.presence,patch)}));notify()}return Promise.resolve()},
 peers(){return[...st.peers.values()]},
 onPeers(f){st.pl.add(f);notify();return()=>st.pl.delete(f)},
 connected(){return st.ok},
 onConnection(f){st.conn.add(f);setTimeout(()=>{try{f(st.ok)}catch(e){}},0);return()=>st.conn.delete(f)},
 join(){return Promise.resolve(room)},leave(){return Promise.resolve()},reconnect(){st.tries=0;now()}
};
window.claude={use:async n=>{if(n!=="room")return null;start();return room}};
})();
/* ===== ONLINE OTOMATIS VIA INTERNET (relay MQTT publik, tanpa server sendiri & tanpa login) ===== */
(function(){
if(!window.MN_MQTT)return;
const NS="minna-nihongo-maya-v1";
let NATIVE=(window.claude&&typeof window.claude.use==="function"&&!window.claude.__mn)?window.claude:null;
let nat=null,natOk=false;
const SEC=location.protocol==="https:";
const mkSpec=a=>{a=[].concat(a);let user="",pass="";const urls=[];for(const raw of a){try{const u=new URL(raw);if(u.username){user=decodeURIComponent(u.username);pass=decodeURIComponent(u.password)}u.username="";u.password="";const h=u.toString();if(SEC&&h.indexOf("ws://")===0)continue;urls.push(h)}catch(e){}}return urls.length?{urls,user,pass}:null};
const BL=window.MN_BROKERS||[["wss://broker.hivemq.com:8884/mqtt","ws://broker.hivemq.com:8000/mqtt"],["wss://broker.emqx.io:8084/mqtt","ws://broker.emqx.io:8083/mqtt"],["wss://mqtt.eclipseprojects.io:443/mqtt","ws://mqtt.eclipseprojects.io:80/mqtt"],["wss://test.mosquitto.org:8081/","ws://test.mosquitto.org:8080/"],["wss://public:public@public.cloud.shiftr.io"]];

const EXTRA22=new Set("洋服 シャツ ズボン スカート 靴 靴下 ネクタイ 手袋 マフラー 着物 指輪 時計 台所 玄関 洋室 畳 風呂 トイレ 窓 引っ越し".split(" "));
const ALL=[];
Object.keys(D).forEach(c=>D[c].split("\n").forEach(l=>{const p=l.split("|");ALL.push({ch:+c,jp:p[0],k:p[1],id:p[2],e:p[3]||"",x:+c===22&&EXTRA22.has(p[0])})}));
const $=id=>document.getElementById(id),app=$("app");
const hasK=s=>/[\u4e00-\u9faf]/.test(s);
const tag=s=>hasK(s)?"Kanji":/^[A-Za-z]+$/.test(s)?"Alfabet":/^[0-9]+$/.test(s)?"Angka":/^[\u30a0-\u30ff]+$/.test(s)?"Katakana":"Hiragana";
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=w=>w.jp===w.k?w.jp:w.jp+" ("+w.k+")";
const pool=s=>s==="all"?ALL.filter(w=>w.ch>=lo()&&w.ch<=hi()):typeof s==="string"?ALL.filter(w=>w.ch>=+s.slice(1)&&w.ch<+s.slice(1)+5):ALL.filter(w=>w.ch===s);
const key=w=>w.ch+"|"+w.jp;
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem("mn1known")||"[]"))}catch(e){}
function save(){try{localStorage.setItem("mn1known",JSON.stringify([...known]))}catch(e){}}
const prog=l=>l.filter(w=>known.has(key(w))).length;
let S="all",L=[],fc={},Q=[],qi=0,sc=0,mode="",done=false;
const R=h=>{app.innerHTML=h;window.scrollTo(0,0)};
const title=()=>S==="all"?"Semua Bab ("+lo()+"–"+hi()+")":typeof S==="string"?"Gabungan Bab "+S.slice(1)+"–"+(+S.slice(1)+4):"Bab "+S;

function home(){
 const n=ALL.length,d=prog(ALL);
 let g="";
 for(let c=5;c<=25;c++){
  const l=pool(c),m=l.length,p=prog(l);
  g+=`<button class="ch" ${m?"":"disabled"} onclick="openCh(${c})"><span class="scr"><b>Bab ${c}</b><span>${m?m+" kartu":"Segera hadir"}</span></span><i class="bar"><u style="width:${m?p/m*100:0}%"></u></i><small>${m?p+"/"+m+" hafal":"&nbsp;"}</small></button>`;
 }
 R(`<div class="hero"><i class="px l"></i><i class="px r"></i><h1 class="ttl">Minna no Nihongo<small>Kotoba I · Bab 5–25</small></h1><div class="chip">GO ➜ Pilih Bab</div><p class="tl">✦ Hai, seikai, mantap! ✦</p><div class="stk">🎲 🧀 🍣</div></div>
 <button class="pri all" onclick="openCh('all')">Semua Bab (5–25)<br><small>${n} kartu tersedia · ${d} hafal</small></button>
 <div class="grid">${g}</div>
 <p class="sm c" style="margin-top:14px">Bab yang bertanda “Segera hadir” kosakatanya belum dimasukkan.</p>`);
}
function openCh(s){S=s;L=pool(s);menu()}
function menu(){
 const nk=L.filter(w=>hasK(w.jp)).length,ne=L.filter(w=>w.e).length;
 R(`<button class="back" onclick="home()">← Kembali ke pilihan bab</button>

/* Flashcard */
function startFC(){fc={o:L.map((_,i)=>i),p:0,f:false};drawFC()}
function drawFC(){
 const w=L[fc.o[fc.p]],k=known.has(key(w));
 const t=`<div class="tags"><span class="tag">${tag(w.jp)}</span><span class="tag x">${w.x?"Tambahan":"Bab "+w.ch}</span></div>`;
 R(`<button class="back" onclick="menu()">← Kembali ke menu ${title()}</button>
 <div class="info"><span>${fc.p+1} / ${L.length}</span><span>Hafal: ${prog(L)}</span></div>
 <div class="card fc" onclick="fc.f=!fc.f;drawFC()">${fc.f
  ?`<div class="kana">${w.k}</div><div class="id">${w.id}</div><div class="hint">Ketuk untuk kembali</div>`
  :`${t}${w.e?`<div class="emo">${w.e}</div>`:""}<div class="jp">${w.jp}</div><div class="hint">Ketuk untuk melihat arti</div>`}</div>
 <div class="row"><button onclick="fcGo(-1)">← Sebelumnya</button><button class="pri" onclick="fcGo(1)">Berikutnya →</button></div>
 <div class="row"><button onclick="fcKnow()">${k?"✓ Hafal (batal)":"✓ Sudah hafal"}</button><button onclick="fc.o=shuf(fc.o);fc.p=0;fc.f=false;drawFC()">Acak</button></div>`);
}
function fcGo(d){fc.p=(fc.p+d+L.length)%L.length;fc.f=false;drawFC()}
function fcKnow(){const k=key(L[fc.o[fc.p]]);known.has(k)?known.delete(k):known.add(k);save();drawFC()}
/* Kuis */
function mk(t,w){
 let c,pl,q;
 if(t==="meaning"){c=w.id;pl=L.filter(x=>x!==w).map(x=>x.id);q=`<div class="tags"><span class="tag">${tag(w.jp)}</span></div><div class="jp">${w.jp}</div>`}
 if(t==="reading"){c=w.k;pl=L.filter(x=>hasK(x.jp)&&x.k!==w.k).map(x=>x.k);q=`<div class="sm">Bagaimana cara bacanya?</div><div class="jp">${w.jp}</div>`}
 if(t==="picture"){c=fmt(w);pl=L.filter(x=>x.e&&x!==w).map(fmt);q=`<div class="sm">Kata Jepang apa untuk gambar ini?</div><div class="emo" style="font-size:80px">${w.e}</div>`}
 const d=shuf([...new Set(pl)].filter(x=>x!==c)).slice(0,3);
 if(d.length<3)return null;
 return{q,c,o:shuf([c,...d]),f:`${w.jp} (${w.k}) = ${w.id}`};
}
function startQ(m){
 mode=m;
 const N=Math.min(10,L.length);
 const ok=w=>({meaning:1,reading:hasK(w.jp),picture:!!w.e});
 const allow=m==="mixed"?["meaning","reading","picture"]:[m];
 Q=[];
 for(const w of shuf(L)){
  const e=ok(w),ts=allow.filter(t=>e[t]);
  if(!ts.length)continue;
  const q=mk(ts[Math.random()*ts.length|0],w);
  if(q)Q.push(q);
  if(Q.length>=N)break;
 }
 qi=0;sc=0;drawQ();
}
const mname={reading:"Kanji Reading Quiz",picture:"Picture Meaning Quiz",mixed:"Mixed Memory Test"};
function drawQ(){
 done=false;
 const back=`<button class="back" onclick="menu()">← Kembali ke menu ${title()}</button>`;
 if(qi>=Q.length){
  R(`${back}<h2>${mname[mode]}</h2><div class="card" style="min-height:190px;cursor:default"><div class="sm">Skor kamu</div><div class="big">${sc} / ${Q.length}</div><div class="sm">${sc>=8?"Bagus sekali!":sc>=5?"Lumayan, ulangi lagi ya.":"Ayo belajar flashcard dulu."}</div></div>
  <div class="row"><button class="pri" onclick="startQ(mode)">Ulangi kuis</button><button onclick="menu()">Menu bab</button></div>`);return}
 const q=Q[qi];
 R(`${back}<div class="info"><span>${mname[mode]} · Soal ${qi+1} / ${Q.length}</span><span>Skor: ${sc}</span></div>
 <div class="card" style="min-height:190px;cursor:default">${q.q}</div>
 <div class="opts">${q.o.map((o,i)=>`<button data-i="${i}" onclick="pick(${i})">${o}</button>`).join("")}</div>
 <div class="fb" id="fb"></div><button id="nx" class="pri" style="width:100%;display:none" onclick="qi++;drawQ()">Lanjut →</button>`);
}
function pick(i){
 if(done)return;done=true;
 const q=Q[qi],ok=q.o[i]===q.c;
 if(ok)sc++;
 document.querySelectorAll(".opts button").forEach((b,j)=>{b.disabled=true;if(q.o[j]===q.c)b.classList.add("ok");else if(j===i)b.classList.add("no")});
 $("fb").innerHTML=(ok?"<b style='color:var(--ok)'>Hai, seikai, mantap! ✨</b>":"<b style='color:var(--no)'>Salah.</b>")+"<br>"+q.f;
 $("nx").style.display="block";
